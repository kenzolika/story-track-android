plugins {
    id "com.android.application"
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace "dev.kenzolika.storytrack"
    compileSdk 34

    defaultConfig {
        applicationId "dev.kenzolika.storytrack"
        minSdk 29
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
        buildConfigField "String", "BASE_URL", "\"https://story-track.kenzolika.workers.dev\""
    }

    buildFeatures {
        buildConfig true
    }

    // Ключ подписи приходит из GitHub Secrets (в репозитории его нет).
    // Без секретов (например, в форке) сборка подписывается отладочным ключом.
    def ksPath = System.getenv("SIGNING_KEYSTORE_PATH")
    def hasKey = ksPath != null && file(ksPath).exists()

    signingConfigs {
        release {
            if (hasKey) {
                storeFile file(ksPath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "storytrack"
                keyPassword System.getenv("SIGNING_STORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
